services:
  app:
    build: .
    image: data-analyst-agent:local
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false # the app runs in rule-based mode without one
    volumes:
      - versions:/data
    extra_hosts:
      # Lets the container reach a local LLM server on the host (Linux needs this).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  versions:
